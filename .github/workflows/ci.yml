name: Godot 4 CI - Tests, Property Checks, Benchmark and Verification

on:
  push:
    branches: [ main, master, development, develop, "feature/**", "fix/**", "qa/**", "chore/**" ]
  pull_request:
    branches: [ main, master, development, develop ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  automated-tests-and-benchmark:
    name: Unit Tests, Property Tests and Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check project structure and documentation
        run: |
          python3 tools/check_project_structure.py
          python3 tools/check_documentation.py

      - name: Setup Godot 4 Headless
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      # Require all restored suites; inspect diagnostics as well as exit codes.
      - name: Run all 15 import, resource, gameplay, security and benchmark checks
        shell: pwsh
        run: ./tools/run_tests.ps1 -GodotBin godot -ResultsDir .godot-test-results/ci

      - name: Upload Test and Benchmark Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-benchmark-report
          path: |
            .godot-test-results/ci/*.log
            benchmarks/reports/GENERATOR_PERFORMANCE_REPORT.md
            docs/qa/SEED_BUG_ISSUES.md
