name: Godot 4 CI - Tests, Property Checks, Benchmark and Verification

on:
  push:
    branches: [ main, master, development, develop, "feature/**", "feat/**", "fix/**", "qa/**", "chore/**" ]
  pull_request:
    branches: [ main, master, development, develop ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  automated-tests-and-benchmark:
    name: Unit Tests, Property Tests and Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot 4 Headless
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Verify Godot Version & Import Project Cache
        run: |
          godot --version
          godot --headless --import

      - name: 1. Run Dungeon Generator Unit Tests (UT-01 .. UT-13)
        run: |
          godot --headless "res://tests/test_dungeon_generator_unit.tscn"

      - name: 2. Run Property-Based Tests (100 Seeds x 5 Invariants)
        run: |
          godot --headless "res://tests/test_dungeon_properties.tscn"

      - name: 3. Run Combat Hitbox Regression Tests (TC-EN-01 .. TC-EN-05)
        run: |
          godot --headless "res://tests/test_orc_battle.tscn"

      - name: 4. Run Dungeon Generator Performance Benchmark
        run: |
          godot --headless "res://tests/benchmark_dungeon_generator.tscn" | tee benchmark_output.log

      - name: 5. Run Skeleton King Boss Arena Tests (SK-01 .. SK-17)
        run: |
          godot --headless "res://tests/test_skeleton_king.tscn"

      - name: 6. Run Doraemon Hero Tests (49 Checks)
        run: |
          godot --headless "res://tests/test_doraemon.tscn"

      - name: 7. Run Yugi Atem Hero Tests
        run: |
          godot --headless "res://tests/test_yugi.tscn"

      - name: 8. Run Werewolf Functional and Integration Tests (50 Checks)
        run: |
          godot --headless "res://tests/test_werewolf.tscn"

      - name: 9. Run MOBA HUD, Inventory & Damage Pool Tests
        timeout-minutes: 5
        shell: bash
        run: |
          godot --headless "res://tests/test_moba_hud_and_inventory.tscn" 2>&1 | tee "$RUNNER_TEMP/moba_hud.log"
          if grep -Eq '(SCRIPT ERROR:|The object does not have any .meta. values|kill_tweens_of)' "$RUNNER_TEMP/moba_hud.log"; then
            echo "::error::Runtime SCRIPT ERROR or invalid metadata/tween call detected in MOBA HUD tests!"
            exit 1
          fi

      - name: 10. Run Hoshimi Miyabi Hero Tests
        run: |
          godot --headless "res://tests/test_miyabi.tscn"

      - name: 11. Run Luong Tho Hero Tests
        run: |
          godot --headless "res://tests/test_luong_tho.tscn"

      - name: 12. Run Projectile Obstacles Tests
        run: |
          godot --headless "res://tests/test_projectile_obstacles.tscn"

      - name: 13. Run Skeleton Archer Combat & Lifecycle Safety Tests
        timeout-minutes: 5
        shell: bash
        run: |
          godot --headless "res://tests/test_archer_combat_lifecycle.tscn" 2>&1 | tee "$RUNNER_TEMP/archer_combat.log"
          if grep -Eq '(SCRIPT ERROR:)' "$RUNNER_TEMP/archer_combat.log"; then
            echo "::error::Runtime SCRIPT ERROR detected in Skeleton Archer tests!"
            exit 1
          fi

      - name: 13. Run EnemyTactics Foundation Tests
        timeout-minutes: 5
        shell: bash
        run: |
          godot --headless --script "res://tests/test_enemy_tactics.gd" 2>&1 | tee "$RUNNER_TEMP/enemy_tactics.log"
          if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/enemy_tactics.log"; then exit 1; fi

      - name: 14. Run Orc Tactical AI at 30 and 144 Render FPS
        timeout-minutes: 5
        shell: bash
        run: |
          for fps in 30 144; do
            godot --headless --max-fps "$fps" "res://tests/test_orc_tactical_ai.tscn" 2>&1 | tee "$RUNNER_TEMP/orc_ai_${fps}.log"
            if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/orc_ai_${fps}.log"; then exit 1; fi
            grep '^\[TRACE\]' "$RUNNER_TEMP/orc_ai_${fps}.log" > "$RUNNER_TEMP/orc_ai_${fps}.trace"
          done
          diff -u "$RUNNER_TEMP/orc_ai_30.trace" "$RUNNER_TEMP/orc_ai_144.trace"

      - name: 15. Run Archer Tactical AI at 30 and 144 Render FPS
        timeout-minutes: 5
        shell: bash
        run: |
          for fps in 30 144; do
            godot --headless --max-fps "$fps" "res://tests/test_archer_tactical_ai.tscn" 2>&1 | tee "$RUNNER_TEMP/archer_ai_${fps}.log"
            if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/archer_ai_${fps}.log"; then exit 1; fi
            grep '^\[TRACE\]' "$RUNNER_TEMP/archer_ai_${fps}.log" > "$RUNNER_TEMP/archer_ai_${fps}.trace"
          done
          diff -u "$RUNNER_TEMP/archer_ai_30.trace" "$RUNNER_TEMP/archer_ai_144.trace"

      - name: 16. Run Mixed Enemy AI and Coroutine Lifecycle Regression
        timeout-minutes: 5
        shell: bash
        run: |
          for fps in 30 144; do
            godot --headless --max-fps "$fps" "res://tests/test_enemy_ai_integration.tscn" 2>&1 | tee "$RUNNER_TEMP/mixed_ai_${fps}.log"
            if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/mixed_ai_${fps}.log"; then exit 1; fi
            grep '^\[TRACE\]' "$RUNNER_TEMP/mixed_ai_${fps}.log" > "$RUNNER_TEMP/mixed_ai_${fps}.trace"
          done
          diff -u "$RUNNER_TEMP/mixed_ai_30.trace" "$RUNNER_TEMP/mixed_ai_144.trace"

      - name: 17. Run Replay Security Tests with Disposable Save Data
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/enemy-ai-replay-data
        run: |
          godot --headless "res://tests/test_replay_security.tscn" 2>&1 | tee "$RUNNER_TEMP/enemy_replay.log"
          if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/enemy_replay.log"; then exit 1; fi

      - name: 18. Run Tactical Navigation Contract at 30 and 144 Render FPS
        timeout-minutes: 5
        shell: bash
        run: |
          for fps in 30 144; do
            godot --headless --max-fps "$fps" "res://tests/test_tactical_navigation_contract.tscn" 2>&1 | tee "$RUNNER_TEMP/tactical_navigation_${fps}.log"
            if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/tactical_navigation_${fps}.log"; then exit 1; fi
            grep '^\[TRACE\]' "$RUNNER_TEMP/tactical_navigation_${fps}.log" > "$RUNNER_TEMP/tactical_navigation_${fps}.trace"
          done
          diff -u "$RUNNER_TEMP/tactical_navigation_30.trace" "$RUNNER_TEMP/tactical_navigation_144.trace"

      - name: 19. Run Tactical BaseEnemy Integration at 30 and 144 Render FPS
        timeout-minutes: 5
        shell: bash
        run: |
          for fps in 30 144; do
            godot --headless --max-fps "$fps" "res://tests/test_tactical_base_enemy_integration.tscn" 2>&1 | tee "$RUNNER_TEMP/tactical_base_enemy_${fps}.log"
            if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/tactical_base_enemy_${fps}.log"; then exit 1; fi
          done

      - name: Upload Benchmark Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-benchmark-report
          path: |
            benchmark_output.log
            docs/BENCHMARK_REPORT.md
            docs/SEED_BUG_ISSUES.md
