name: Godot 4 CI - Tests, Property Checks, Benchmark and Verification

on:
  push:
    branches: [ main, master, development, develop, "feature/**", "feat/**", "fix/**", "qa/**", "chore/**" ]
  pull_request:
    branches: [ main, master, development, develop ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  automated-tests-and-benchmark:
    name: Unit Tests, Property Tests and Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot 4 Headless
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Verify Godot Version & Import Project Cache
        run: |
          godot --version
          godot --headless --import

      - name: Verify Issue 75 evidence runner rejects incomplete or failed suites
        run: python3 -m unittest discover -s tests -p test_issue75_runner.py -v

      - name: Verify Tutorial evidence runner rejects incomplete or failed suites
        run: python3 -m unittest discover -s tests -p test_tutorial_runner.py -v

      - name: Run Tutorial Framework with Disposable Save Data
        timeout-minutes: 10
        run: python3 tests/run_tutorial_verification.py --godot godot --suites test_tutorial_framework

      - name: Run Tutorial Movement and Combat at 30 and 144 FPS
        timeout-minutes: 20
        run: python3 tests/run_tutorial_verification.py --godot godot --cross-fps --suites test_tutorial_movement test_tutorial_combat test_tutorial_hero_skills

      - name: Run Tutorial Inventory, Survival, Isolation and End-to-End at 30 and 144 FPS
        timeout-minutes: 25
        run: python3 tests/run_tutorial_verification.py --godot godot --cross-fps --suites test_tutorial_inventory test_tutorial_survival test_tutorial_inventory_isolation test_tutorial_end_to_end

      - name: Run Tutorial Hall, UI, Input, Recovery, Persistence and Dungeon Entry at 30 and 144 FPS
        timeout-minutes: 30
        run: python3 tests/run_tutorial_verification.py --godot godot --cross-fps --suites test_tutorial_hall_integration test_tutorial_ui test_tutorial_input_isolation test_tutorial_recovery test_tutorial_persistence test_tutorial_dungeon_entry

      - name: 1. Run Dungeon Generator Unit Tests (UT-01 .. UT-13)
        run: |
          godot --headless "res://tests/test_dungeon_generator_unit.tscn"

      - name: 2. Run Property-Based Tests (100 Seeds x 5 Invariants)
        run: |
          godot --headless "res://tests/test_dungeon_properties.tscn"

      - name: 3. Run Combat Hitbox Regression Tests (TC-EN-01 .. TC-EN-05)
        run: |
          godot --headless "res://tests/test_orc_battle.tscn"

      - name: 4. Run Dungeon Generator Performance Benchmark
        run: |
          godot --headless "res://tests/benchmark_dungeon_generator.tscn" | tee benchmark_output.log

      - name: 5. Run Skeleton King Boss Arena Tests (SK-01 .. SK-17)
        run: |
          godot --headless "res://tests/test_skeleton_king.tscn"

      - name: 6. Run Doraemon Hero Tests (49 Checks)
        run: |
          godot --headless "res://tests/test_doraemon.tscn"

      - name: 7. Run Yugi Atem Hero Tests
        run: |
          godot --headless "res://tests/test_yugi.tscn"

      - name: 8. Run Werewolf Functional and Integration Tests (50 Checks)
        run: |
          godot --headless "res://tests/test_werewolf.tscn"

      - name: 9. Run MOBA HUD, Inventory & Damage Pool Tests
        timeout-minutes: 5
        shell: bash
        run: |
          godot --headless "res://tests/test_moba_hud_and_inventory.tscn" 2>&1 | tee "$RUNNER_TEMP/moba_hud.log"
          if grep -Eq '(SCRIPT ERROR:|The object does not have any .meta. values|kill_tweens_of)' "$RUNNER_TEMP/moba_hud.log"; then
            echo "::error::Runtime SCRIPT ERROR or invalid metadata/tween call detected in MOBA HUD tests!"
            exit 1
          fi

      - name: 10. Run Hoshimi Miyabi Hero Tests
        run: |
          godot --headless "res://tests/test_miyabi.tscn"

      - name: 11. Run Luong Tho Hero Tests
        run: |
          godot --headless "res://tests/test_luong_tho.tscn"

      - name: 12. Run Projectile Obstacles Tests
        run: |
          godot --headless "res://tests/test_projectile_obstacles.tscn"

      - name: 13. Run Skeleton Archer Combat & Lifecycle Safety Tests
        timeout-minutes: 5
        shell: bash
        run: |
          godot --headless "res://tests/test_archer_combat_lifecycle.tscn" 2>&1 | tee "$RUNNER_TEMP/archer_combat.log"
          if grep -Eq '(SCRIPT ERROR:)' "$RUNNER_TEMP/archer_combat.log"; then
            echo "::error::Runtime SCRIPT ERROR detected in Skeleton Archer tests!"
            exit 1
          fi

      - name: 13. Run EnemyTactics Foundation Tests
        timeout-minutes: 5
        shell: bash
        run: |
          godot --headless --script "res://tests/test_enemy_tactics.gd" 2>&1 | tee "$RUNNER_TEMP/enemy_tactics.log"
          if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/enemy_tactics.log"; then exit 1; fi

      - name: 14. Run Orc Tactical AI at 30 and 144 Render FPS
        timeout-minutes: 5
        shell: bash
        run: |
          for fps in 30 144; do
            godot --headless --max-fps "$fps" "res://tests/test_orc_tactical_ai.tscn" 2>&1 | tee "$RUNNER_TEMP/orc_ai_${fps}.log"
            if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/orc_ai_${fps}.log"; then exit 1; fi
            grep '^\[TRACE\]' "$RUNNER_TEMP/orc_ai_${fps}.log" > "$RUNNER_TEMP/orc_ai_${fps}.trace"
          done
          diff -u "$RUNNER_TEMP/orc_ai_30.trace" "$RUNNER_TEMP/orc_ai_144.trace"

      - name: 15. Run Archer Tactical AI at 30 and 144 Render FPS
        timeout-minutes: 5
        shell: bash
        run: |
          for fps in 30 144; do
            godot --headless --max-fps "$fps" "res://tests/test_archer_tactical_ai.tscn" 2>&1 | tee "$RUNNER_TEMP/archer_ai_${fps}.log"
            if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/archer_ai_${fps}.log"; then exit 1; fi
            grep '^\[TRACE\]' "$RUNNER_TEMP/archer_ai_${fps}.log" > "$RUNNER_TEMP/archer_ai_${fps}.trace"
          done
          diff -u "$RUNNER_TEMP/archer_ai_30.trace" "$RUNNER_TEMP/archer_ai_144.trace"

      - name: 16. Run Mixed Enemy AI and Coroutine Lifecycle Regression
        timeout-minutes: 5
        shell: bash
        run: |
          for fps in 30 144; do
            godot --headless --max-fps "$fps" "res://tests/test_enemy_ai_integration.tscn" 2>&1 | tee "$RUNNER_TEMP/mixed_ai_${fps}.log"
            if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/mixed_ai_${fps}.log"; then exit 1; fi
            grep '^\[TRACE\]' "$RUNNER_TEMP/mixed_ai_${fps}.log" > "$RUNNER_TEMP/mixed_ai_${fps}.trace"
          done
          diff -u "$RUNNER_TEMP/mixed_ai_30.trace" "$RUNNER_TEMP/mixed_ai_144.trace"

      - name: 17. Run Replay Security Tests with Disposable Save Data
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/enemy-ai-replay-data
        run: |
          godot --headless "res://tests/test_replay_security.tscn" 2>&1 | tee "$RUNNER_TEMP/enemy_replay.log"
          if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/enemy_replay.log"; then exit 1; fi

      - name: Run Potion Economy Regression Tests
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/potion-regression-data
        run: |
          godot --headless "res://tests/test_potion_system.tscn" 2>&1 | tee "$RUNNER_TEMP/potion_system.log"
          if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/potion_system.log"; then exit 1; fi

      - name: Run Defensive Combat Balance at 30 and 144 Render FPS
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/defensive-combat-data
        run: |
          set -euo pipefail
          for fps in 30 144; do
            godot --headless --max-fps "$fps" "res://tests/test_defensive_combat_balance.tscn" 2>&1 | tee "$RUNNER_TEMP/defensive_${fps}.log"
            if grep -Eq '^(SCRIPT ERROR:|ERROR:|\[FAIL\])' "$RUNNER_TEMP/defensive_${fps}.log"; then exit 1; fi
            grep -Eq '^DEFENSIVE RESULTS: [0-9]+ PASSED, 0 FAILED$' "$RUNNER_TEMP/defensive_${fps}.log"
            grep '^\[TRACE\]' "$RUNNER_TEMP/defensive_${fps}.log" > "$RUNNER_TEMP/defensive_${fps}.trace"
          done
          diff -u "$RUNNER_TEMP/defensive_30.trace" "$RUNNER_TEMP/defensive_144.trace"

      - name: Run Equipment Loot and Perk Balance at 30 and 144 Render FPS
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/equipment-balance-data
        run: |
          set -euo pipefail
          for fps in 30 144; do
            godot --headless --max-fps "$fps" "res://tests/test_equipment_loot_perk_balance.tscn" 2>&1 | tee "$RUNNER_TEMP/equipment_${fps}.log"
            if grep -Eq '^(SCRIPT ERROR:|ERROR:|\[FAIL\]|\[RUNTIME\])' "$RUNNER_TEMP/equipment_${fps}.log"; then exit 1; fi
            grep -Eq '^EQUIPMENT RESULTS: [0-9]+ PASSED, 0 FAILED$' "$RUNNER_TEMP/equipment_${fps}.log"
            grep '^\[TRACE\]' "$RUNNER_TEMP/equipment_${fps}.log" > "$RUNNER_TEMP/equipment_${fps}.trace"
          done
          diff -u "$RUNNER_TEMP/equipment_30.trace" "$RUNNER_TEMP/equipment_144.trace"

      - name: Run Enemy Floor Balance at 30 and 144 Render FPS
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/enemy-floor-balance-data
        run: |
          set -euo pipefail
          for fps in 30 144; do
            godot --headless --max-fps "$fps" "res://tests/test_enemy_floor_balance.tscn" 2>&1 | tee "$RUNNER_TEMP/enemy_floor_${fps}.log"
            if grep -Eq '^(SCRIPT ERROR:|ERROR:|\[FAIL\]|\[RUNTIME\])' "$RUNNER_TEMP/enemy_floor_${fps}.log"; then exit 1; fi
            grep -Eq '^ENEMY FLOOR RESULTS: [0-9]+ PASSED, 0 FAILED$' "$RUNNER_TEMP/enemy_floor_${fps}.log"
            grep '^\[TRACE\]' "$RUNNER_TEMP/enemy_floor_${fps}.log" > "$RUNNER_TEMP/enemy_floor_${fps}.trace"
          done
          diff -u "$RUNNER_TEMP/enemy_floor_30.trace" "$RUNNER_TEMP/enemy_floor_144.trace"

      - name: Run Development Integration and Chest Contracts at 30 and 144 FPS
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/issue75-integration-data
        run: |
          set -euo pipefail
          for fps in 30 144; do
            godot --headless --max-fps "$fps" "res://tests/test_issue75_development_integration.tscn" 2>&1 | tee "$RUNNER_TEMP/integration_${fps}.log"
            if grep -Eq '^[[:space:]]*(SCRIPT ERROR:|ERROR:|\[FAIL\]|\[RUNTIME\])' "$RUNNER_TEMP/integration_${fps}.log"; then exit 1; fi
            grep -Eq '^INTEGRATION RESULTS: [0-9]+ PASSED, 0 FAILED$' "$RUNNER_TEMP/integration_${fps}.log"
            grep '^\[TRACE\]' "$RUNNER_TEMP/integration_${fps}.log" > "$RUNNER_TEMP/integration_${fps}.trace"
            godot --headless --max-fps "$fps" "res://tests/test_bug_bash_regressions.tscn" 2>&1 | tee "$RUNNER_TEMP/bug_bash_${fps}.log"
            if grep -Eq '^[[:space:]]*(SCRIPT ERROR:|ERROR:|\[FAIL\]|\[RUNTIME\])' "$RUNNER_TEMP/bug_bash_${fps}.log"; then exit 1; fi
            grep -Eq 'BUG BASH REGRESSION RESULTS: [0-9]+ PASSED, 0 FAILED$' "$RUNNER_TEMP/bug_bash_${fps}.log"
          done
          diff -u "$RUNNER_TEMP/integration_30.trace" "$RUNNER_TEMP/integration_144.trace"

      - name: Run Issue 75 Progression Distributions at 30 and 144 Render FPS
        timeout-minutes: 20
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/issue75-progression-data
        run: |
          set -euo pipefail
          for fps in 30 144; do
            godot --headless --max-fps "$fps" "res://tests/test_issue75_progression_balance.tscn" 2>&1 | tee "$RUNNER_TEMP/progression_${fps}.log"
            if grep -Eq '^(SCRIPT ERROR:|ERROR:|\[FAIL\]|\[RUNTIME\])' "$RUNNER_TEMP/progression_${fps}.log"; then exit 1; fi
            grep -Eq '^PROGRESSION RESULTS: [0-9]+ PASSED, 0 FAILED$' "$RUNNER_TEMP/progression_${fps}.log"
            grep '^\[TRACE\]' "$RUNNER_TEMP/progression_${fps}.log" > "$RUNNER_TEMP/progression_${fps}.trace"
          done
          diff -u "$RUNNER_TEMP/progression_30.trace" "$RUNNER_TEMP/progression_144.trace"

      - name: Run Issue 75 Gameplay Acceptance at 30 and 144 Render FPS
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/issue75-acceptance-data
        run: |
          set -euo pipefail
          for fps in 30 144; do
            godot --headless --max-fps "$fps" "res://tests/test_issue75_acceptance.tscn" 2>&1 | tee "$RUNNER_TEMP/acceptance_${fps}.log"
            if grep -Eq '^(SCRIPT ERROR:|ERROR:|\[FAIL\]|\[RUNTIME\])' "$RUNNER_TEMP/acceptance_${fps}.log"; then exit 1; fi
            grep -Eq '^ACCEPTANCE RESULTS: [0-9]+ PASSED, 0 FAILED$' "$RUNNER_TEMP/acceptance_${fps}.log"
            grep '^\[TRACE\]' "$RUNNER_TEMP/acceptance_${fps}.log" > "$RUNNER_TEMP/acceptance_${fps}.trace"
          done
          diff -u "$RUNNER_TEMP/acceptance_30.trace" "$RUNNER_TEMP/acceptance_144.trace"

      - name: Run Issue 75 Real-Scene Combat Pacing at 30 and 144 Render FPS
        timeout-minutes: 10
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/issue75-combat-pacing-data
        run: |
          set -euo pipefail
          for fps in 30 144; do
            godot --headless --max-fps "$fps" "res://tests/test_issue75_combat_pacing.tscn" 2>&1 | tee "$RUNNER_TEMP/combat_pacing_${fps}.log"
            if grep -Eq '^[[:space:]]*(SCRIPT ERROR:|ERROR:|\[FAIL\]|\[RUNTIME\])' "$RUNNER_TEMP/combat_pacing_${fps}.log"; then exit 1; fi
            grep -Eq '^COMBAT PACING RESULTS: [0-9]+ PASSED, 0 FAILED$' "$RUNNER_TEMP/combat_pacing_${fps}.log"
            grep '^\[TRACE\]' "$RUNNER_TEMP/combat_pacing_${fps}.log" > "$RUNNER_TEMP/combat_pacing_${fps}.trace"
          done
          diff -u "$RUNNER_TEMP/combat_pacing_30.trace" "$RUNNER_TEMP/combat_pacing_144.trace"

      - name: Run Issue 75 Acquisition Evidence and Early Candidate Contracts
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/issue75-acquisition-data
        run: |
          set -euo pipefail
          for fps in 30 144; do
            godot --headless --max-fps "$fps" "res://tests/test_issue75_acquisition.tscn" 2>&1 | tee "$RUNNER_TEMP/acquisition_${fps}.log"
            if grep -Eq '^[[:space:]]*(SCRIPT ERROR:|ERROR:|\[FAIL\]|\[RUNTIME\])' "$RUNNER_TEMP/acquisition_${fps}.log"; then exit 1; fi
            grep -Eq '^ACQUISITION RESULTS: [0-9]+ PASSED, 0 FAILED$' "$RUNNER_TEMP/acquisition_${fps}.log"
            grep '^\[TRACE\]' "$RUNNER_TEMP/acquisition_${fps}.log" > "$RUNNER_TEMP/acquisition_${fps}.trace"
          done
          diff -u "$RUNNER_TEMP/acquisition_30.trace" "$RUNNER_TEMP/acquisition_144.trace"

      - name: 18. Run Tactical Navigation Contract at 30 and 144 Render FPS
        timeout-minutes: 5
        shell: bash
        run: |
          for fps in 30 144; do
            godot --headless --max-fps "$fps" "res://tests/test_tactical_navigation_contract.tscn" 2>&1 | tee "$RUNNER_TEMP/tactical_navigation_${fps}.log"
            if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/tactical_navigation_${fps}.log"; then exit 1; fi
            grep '^\[TRACE\]' "$RUNNER_TEMP/tactical_navigation_${fps}.log" > "$RUNNER_TEMP/tactical_navigation_${fps}.trace"
          done
          diff -u "$RUNNER_TEMP/tactical_navigation_30.trace" "$RUNNER_TEMP/tactical_navigation_144.trace"

      - name: 19. Run Tactical BaseEnemy Integration at 30 and 144 Render FPS
        timeout-minutes: 5
        shell: bash
        run: |
          for fps in 30 144; do
            godot --headless --max-fps "$fps" "res://tests/test_tactical_base_enemy_integration.tscn" 2>&1 | tee "$RUNNER_TEMP/tactical_base_enemy_${fps}.log"
            if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/tactical_base_enemy_${fps}.log"; then exit 1; fi
          done

      - name: 20. Run Coin Drops & Pickup Tests with Disposable Save Data
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/coins-data
        run: |
          godot --headless "res://tests/test_coins.tscn" 2>&1 | tee "$RUNNER_TEMP/coins.log"
          if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/coins.log"; then exit 1; fi

      - name: 21. Run Guild Hall Scene, Walls & Minimap Tests with Disposable Save Data
        timeout-minutes: 10
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/guild_hall-data
        run: |
          godot --headless "res://tests/test_guild_hall.tscn" 2>&1 | tee "$RUNNER_TEMP/guild_hall.log"
          if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/guild_hall.log"; then exit 1; fi

      - name: 22. Run Guild Hall Character Select Tests with Disposable Save Data
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/hall_select-data
        run: |
          godot --headless "res://tests/test_hall_select.tscn" 2>&1 | tee "$RUNNER_TEMP/hall_select.log"
          if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/hall_select.log"; then exit 1; fi

      - name: 23. Run Rune Sword Portal (Guild Hall -> Floor 1) Tests with Disposable Save Data
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/rune_portal-data
        run: |
          godot --headless "res://tests/test_rune_portal.tscn" 2>&1 | tee "$RUNNER_TEMP/rune_portal.log"
          if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/rune_portal.log"; then exit 1; fi

      - name: 24. Run Blacksmith Shop Tests with Disposable Save Data
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/shop-data
        run: |
          godot --headless "res://tests/test_shop.tscn" 2>&1 | tee "$RUNNER_TEMP/shop.log"
          if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/shop.log"; then exit 1; fi

      - name: 25. Run Mage Perk Shop Tests with Disposable Save Data
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/mage_shop-data
        run: |
          godot --headless "res://tests/test_mage_shop.tscn" 2>&1 | tee "$RUNNER_TEMP/mage_shop.log"
          if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/mage_shop.log"; then exit 1; fi

      - name: 26. Run Alchemist Potion Shop Tests with Disposable Save Data
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/potion_shop-data
        run: |
          godot --headless "res://tests/test_potion_shop.tscn" 2>&1 | tee "$RUNNER_TEMP/potion_shop.log"
          if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/potion_shop.log"; then exit 1; fi

      - name: 27. Run Persistent Wallet Tests with Disposable Save Data
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/wallet-data
        run: |
          godot --headless "res://tests/test_wallet.tscn" 2>&1 | tee "$RUNNER_TEMP/wallet.log"
          if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/wallet.log"; then exit 1; fi

      - name: 28. Run Wandering Merchant Tests (Joanna / Eleonore) with Disposable Save Data
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/merchant-data
        run: |
          godot --headless "res://tests/test_wandering_merchant.tscn" 2>&1 | tee "$RUNNER_TEMP/merchant.log"
          if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/merchant.log"; then exit 1; fi

      - name: 29. Run Main Menu Modal Layout Tests (SPK-11) with Disposable Save Data
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/main-menu-data
        run: |
          godot --headless "res://tests/test_main_menu_modals.tscn" 2>&1 | tee "$RUNNER_TEMP/main_menu_modals.log"
          if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/main_menu_modals.log"; then exit 1; fi

      - name: 30. Run Yugi Audio Tests (MUGEN Yami Yugi sounds) with Disposable Save Data
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/yugi-audio-data
        run: |
          godot --headless "res://tests/test_yugi_audio.tscn" 2>&1 | tee "$RUNNER_TEMP/yugi_audio.log"
          if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/yugi_audio.log"; then exit 1; fi

      - name: 31. Run Miyabi & Luong Tho Sound Effect Tests with Disposable Save Data
        timeout-minutes: 5
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/hero-sfx-data
        run: |
          godot --headless "res://tests/test_hero_sfx.tscn" 2>&1 | tee "$RUNNER_TEMP/hero_sfx.log"
          if grep -Eq '^(SCRIPT ERROR:|ERROR:)' "$RUNNER_TEMP/hero_sfx.log"; then exit 1; fi

      - name: Upload Benchmark Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-benchmark-report
          path: |
            benchmark_output.log
            docs/BENCHMARK_REPORT.md
            docs/SEED_BUG_ISSUES.md
