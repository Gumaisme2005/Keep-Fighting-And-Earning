name: Godot 4 CI - Tests, Property Checks, Benchmark and Verification

on:
  push:
    branches: [ main, master, development, develop, "feature/**", "fix/**", "qa/**", "chore/**" ]
  pull_request:
    branches: [ main, master, development, develop ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  automated-tests-and-benchmark:
    name: Unit Tests, Property Tests and Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot 4 Headless
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Verify Godot Version & Import Project Cache
        run: |
          godot --version
          godot --headless --import

      - name: 1. Run Dungeon Generator Unit Tests (UT-01 .. UT-13)
        if: hashFiles('tests/test_dungeon_generator_unit.tscn') != ''
        run: |
          godot --headless "res://tests/test_dungeon_generator_unit.tscn"

      - name: 2. Run Property-Based Tests (100 Seeds x 5 Invariants)
        if: hashFiles('tests/test_dungeon_properties.tscn') != ''
        run: |
          godot --headless "res://tests/test_dungeon_properties.tscn"

      - name: 3. Run Combat Hitbox Regression Tests (TC-EN-01 .. TC-EN-05)
        if: hashFiles('tests/test_orc_battle.tscn') != ''
        run: |
          godot --headless "res://tests/test_orc_battle.tscn"

      - name: 4. Run Dungeon Generator Performance Benchmark
        if: hashFiles('tests/benchmark_dungeon_generator.tscn') != ''
        run: |
          godot --headless "res://tests/benchmark_dungeon_generator.tscn" | tee benchmark_output.log

      - name: 5. Run Skeleton King Boss Arena Tests (SK-01 .. SK-17)
        if: hashFiles('tests/test_skeleton_king.tscn') != ''
        run: |
          godot --headless "res://tests/test_skeleton_king.tscn"

      - name: 6. Run Doraemon Hero Tests (47 Checks)
        if: hashFiles('tests/test_doraemon.tscn') != ''
        run: |
          godot --headless "res://tests/test_doraemon.tscn"

      - name: 7. Run Yugi Atem Hero Tests
        if: hashFiles('tests/test_yugi.tscn') != ''
        run: |
          godot --headless "res://tests/test_yugi.tscn"

      - name: 8. Run Werewolf Functional and Integration Tests (50 Checks)
        if: hashFiles('tests/test_werewolf.tscn') != ''
        run: |
          godot --headless "res://tests/test_werewolf.tscn"

      - name: 9. Run MOBA HUD & Minecraft Inventory Stacking Tests (26 Checks)
        if: hashFiles('tests/test_moba_hud_and_inventory.tscn') != ''
        run: |
          godot --headless "res://tests/test_moba_hud_and_inventory.tscn"

      - name: 10. Run Replay Capacity & Memory Protection Tests (39 Checks)
        if: hashFiles('tests/test_replay_security.tscn') != ''
        run: |
          godot --headless "res://tests/test_replay_security.tscn"

      - name: Upload Benchmark Evidence Artifact
        if: hashFiles('benchmark_output.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-benchmark-report
          path: |
            benchmark_output.log
            docs/BENCHMARK_REPORT.md
            docs/SEED_BUG_ISSUES.md
